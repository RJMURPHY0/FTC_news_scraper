<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        window.addEventListener('error', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style = 'position: fixed; top: 10px; left: 10px; background: red; color: white; z-index: 9999; padding: 10px; white-space: pre-wrap; font-family: monospace; border: 2px solid white; border-radius: 4px;';
            errDiv.innerText = 'JS Error: ' + e.message + '\n' + e.filename + ':' + e.lineno;
            document.body.appendChild(errDiv);
        });
        window.addEventListener('unhandledrejection', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style = 'position: fixed; top: 10px; right: 10px; background: orange; color: white; z-index: 9999; padding: 10px; white-space: pre-wrap; font-family: monospace; border: 2px solid white; border-radius: 4px;';
            errDiv.innerText = 'Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
            document.body.appendChild(errDiv);
        });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Safety Solutions | AI Dashboard</title>
    <!-- We will use Inter to approximate Avenir Roman if Avenir is unavailable locally -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="FTC Transparent Logo.png" alt="FTC Safety Solutions" class="logo-img">
        </div>
        <div class="navbar-stats">
            <div class="stat-pill" id="stat-articles">
                <span class="stat-label">Articles</span>
                <span class="stat-count" id="count-articles">0</span>
            </div>
            <div class="stat-pill saved" id="stat-saved">
                <span class="stat-label">Saved</span>
                <span class="stat-count" id="count-saved">0</span>
            </div>
        </div>
    </header>

    <main class="dashboard-hero">
        <!-- Top border -->
        <div class="hero-border"></div>

        <!-- Waves Container -->
        <div id="waves-banner"></div>

        <!-- Bottom border -->
        <div class="hero-border"></div>

        <div class="hero-content">
            <span class="badge">Last 24 Hours</span>
            <h1>Artificial Intelligence<br><span class="highlight">Safety & News</span></h1>
            <p>Your daily pulse on AI news, tools, and insights relevant to modern industrial solutions.</p>
        </div>
    </main>

    <div class="content-wrapper">
        <div class="dashboard-controls">
            <h2>Latest Insights</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Sources</button>
                <button class="filter-btn" data-filter="saved">Saved Articles</button>
            </div>
        </div>

        <section class="grid-container" id="articles-grid">
            <!-- Articles injected via JS -->
            <!-- Placeholder Card -->
            <div class="article-card loading">
                <div class="img-skeleton"></div>
                <div class="text-skeleton"></div>
                <div class="text-skeleton short"></div>
            </div>
            <div class="article-card loading">
                <div class="img-skeleton"></div>
                <div class="text-skeleton"></div>
                <div class="text-skeleton short"></div>
            </div>
            <div class="article-card loading">
                <div class="img-skeleton"></div>
                <div class="text-skeleton"></div>
                <div class="text-skeleton short"></div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
    <script type="module">
        import { initWaves } from './waves.js';
        initWaves('#waves-banner');
    </script>
</body>
</html>
